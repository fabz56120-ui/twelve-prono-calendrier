

name: Mise à jour calendrier PRO D2

on:
  workflow_dispatch:

  schedule:
  #   # Jeudi
  - cron: "12 17 * * 4"  # Jeudi 19h12 France
  - cron: "10 18 * * 4"  # Jeudi 20h10 France
  - cron: "40 18 * * 4"  # Jeudi 20h40 France

  # Vendredi
  - cron: "12 16 * * 5" # Vendredi 18h12 France
  - cron: "12 17 * * 5"  # Vendredi 19h12 France
  - cron: "12 18 * * 5"  # Vendredi 20h12 France
  - cron: "17 19 * * 5"  # Vendredi 21h17   

  # DimancheTEST
  - cron: "27 07 * * 6" # D 12h27 decalage 3h
  - cron: "12 08 * * 6"  # D 13h08
  - cron: "26 08 * * 6"  # D 13h26
  
  
permissions:
  contents: write

jobs:
  update-calendrier:
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v4

      - name: Installation de Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installation de Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Récupération des matchs et résultats
        run: |
          python scraper_calendrier.py

      - name: Enregistrement du calendrier
        run: |
          git config user.name "Twelve Prono Bot"
          git config user.email "actions@github.com"

          git add calendrier.json

          if git diff --cached --quiet
          then
            echo "Aucune modification du calendrier."
          else
            git commit -m "Mise à jour automatique du calendrier"
            git push
          fi
