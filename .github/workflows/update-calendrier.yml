

name: Mise à jour calendrier PRO D2

on:
  workflow_dispatch:

  schedule:
    - cron: "30 21 * * 4"
    - cron: "30 21 * * 5"

permissions:
  contents: write

jobs:
  update-calendrier:
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v4

      - name: Installation de Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installation de Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Récupération des matchs et résultats
        run: |
          python scraper_calendrier.py

      - name: Enregistrement du calendrier
        run: |
          git config user.name "Twelve Prono Bot"
          git config user.email "actions@github.com"

          git add calendrier.json

          if git diff --cached --quiet
          then
            echo "Aucune modification du calendrier."
          else
            git commit -m "Mise à jour automatique du calendrier"
            git push
          fi
